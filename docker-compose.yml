services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-support-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_support
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_support"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
